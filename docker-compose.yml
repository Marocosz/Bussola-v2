services:
  bussola_backend:
    build: ./bussola_api
    container_name: bussola_backend
    env_file:
      - ./bussola_api/.env
    environment:
      - TZ=America/Sao_Paulo
      - BOT_WEBHOOK_URL=http://bussola_bot:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./bussola_api/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
      - coolify

  frontend:
    build: ./bussola_web
    container_name: bussola_frontend
    restart: unless-stopped
    depends_on:
      - bussola_backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - internal
      - coolify

  bussola_bot:
    build: ./bussola_bot
    container_name: bussola_bot
    environment:
      - TZ=America/Sao_Paulo
      - API_BASE_URL=http://bussola_backend:8000
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - BOT_SERVICE_TOKEN=${BOT_SERVICE_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    depends_on:
      - bussola_backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - internal
      - coolify

networks:
  internal:
    driver: bridge
  coolify:
    external: true
