services:
  bussola_backend:
    build: ./bussola_api
    container_name: bussola_backend
    env_file:
      - ./bussola_api/.env
    environment:
      - TZ=America/Sao_Paulo
      - BOT_WEBHOOK_URL=http://bussola_bot:8001
    volumes:
      - ./bussola_api/data:/app/data
    restart: unless-stopped
    networks:
      - internal
      - coolify

  frontend:
    build: ./bussola_web
    container_name: bussola_frontend
    restart: unless-stopped
    depends_on:
      - bussola_backend
    networks:
      - internal
      - coolify

  bussola_bot:
    build: ./bussola_bot
    container_name: bussola_bot
    environment:
      - TZ=America/Sao_Paulo
      - API_BASE_URL=http://bussola_backend:8000
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - BOT_SERVICE_TOKEN=${BOT_SERVICE_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL}
    restart: unless-stopped
    depends_on:
      - bussola_backend
    networks:
      - internal
      - coolify

networks:
  internal:
    driver: bridge
  coolify:
    external: true
