services:
  # Serviço da API
  backend:
    container_name: bussola_backend
    build: ./bussola_api
    volumes:
      # Persistência do SQLite: Mapeia a pasta data do host para o container
      - ./bussola_api/data:/app/data
    env_file:
      - ./bussola_api/.env
    networks:
      - bussola_net

  # Serviço do Frontend (Web)
  frontend:
    container_name: bussola_frontend
    build: ./bussola_web
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - bussola_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bussola-frontend.rule=Host(`bussola.marocos.dev`)"
      - "traefik.http.routers.bussola-frontend.entrypoints=https"
      - "traefik.http.routers.bussola-frontend.tls=true"
      - "traefik.http.routers.bussola-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.bussola-frontend.loadbalancer.server.port=80"

networks:
  bussola_net:
    driver: bridge
  coolify:
    external: true