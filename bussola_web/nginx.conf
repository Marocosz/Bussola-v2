server {
    listen 80;

    # Onde estão os arquivos do React buildado
    root /usr/share/nginx/html;
    index index.html;

    # Configuração para SPA (React Router)
    # Qualquer rota que não seja arquivo, redireciona para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Reverso para a API (Backend)
    # O frontend chama /api/v1 e o Nginx repassa para o container do backend
    location /api/ {
        resolver 127.0.0.11 ipv6=off;
        set $backend http://bussola_backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}